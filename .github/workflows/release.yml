name: Release - Signed APK + AAB

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g., v123)'
        required: true
        type: string

jobs:
  build-release:
    name: Build Release APK + AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed for creating releases
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for commit count

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27c
          cmdline-tools-version: latest
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Calculate versionCode (commits in main)
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count main)
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          
          # versionName: from tag if push tag, else from workflow_dispatch input
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
            echo "version_name=$TAG_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version_name=${{ github.event.inputs.version_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > app/local.properties
          echo "versionCode=${{ steps.version.outputs.commit_count }}" >> app/local.properties
          echo "versionName=${{ steps.version.outputs.version_name }}" >> app/local.properties
          cat app/local.properties

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.p12
          echo "Keystore restored: $(ls -lh app/keystore/release.p12)"
          
          # Verify keystore loads (optional sanity check)
          keytool -list -v -keystore app/keystore/release.p12 -storetype PKCS12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" || echo "Keystore verification skipped (keytool may not be available)"

      - name: Build Release APK + AAB
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file=app/keystore/release.p12 \
            -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            -Pandroid.injected.signing.store.type=PKCS12

      - name: Verify Release APK
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$APK_PATH" ] && [ -f "$AAB_PATH" ]; then
            echo "✅ Release APK: $APK_PATH ($(stat -c%s "$APK_PATH") bytes)"
            echo "✅ Release AAB: $AAB_PATH ($(stat -c%s "$AAB_PATH") bytes)"
          else
            echo "::error::Release artifacts not found"
            ls -la app/build/outputs/apk/release/ 2>/dev/null || true
            ls -la app/build/outputs/bundle/release/ 2>/dev/null || true
            exit 1
          fi

      - name: Create Release ZIP
        run: |
          VERSION="${{ steps.version.outputs.version_name }}"
          zip -j "NaydiVesch-Release-${VERSION}.zip" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab
          echo "ZIP created: NaydiVesch-Release-${VERSION}.zip"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NaydiVesch-Release-${{ steps.version.outputs.version_name }}
          path: NaydiVesch-Release-${{ steps.version.outputs.version_name }}.zip
          retention-days: 90

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Release **${{ github.ref_name }}**
            
            - **APK**: `app-release.apk` (подписанный, для установки на устройства)
            - **AAB**: `app-release.aab` (для Google Play, если понадобится)
            
            **versionCode**: ${{ steps.version.outputs.commit_count }}
            **versionName**: ${{ github.ref_name }}
          files: NaydiVesch-Release-${{ steps.version.outputs.version_name }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}