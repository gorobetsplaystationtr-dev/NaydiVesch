name: CI - Debug Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27c
          cmdline-tools-version: latest
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Calculate versionCode (commits in main)
        id: version
        run: |
          # Count commits in main branch history
          git fetch --unshallow origin main 2>/dev/null || true
          COMMIT_COUNT=$(git rev-list --count main)
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "versionCode=$COMMIT_COUNT"
          echo "versionName=v$COMMIT_COUNT"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > app/local.properties
          echo "versionCode=${{ steps.version.outputs.commit_count }}" >> app/local.properties
          echo "versionName=v${{ steps.version.outputs.commit_count }}" >> app/local.properties
          cat app/local.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Verify Debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "✅ Debug APK found: $APK_PATH"
            echo "SIZE=$(stat -c%s "$APK_PATH")" >> $GITHUB_OUTPUT
          else
            echo "::error::Debug APK not found at $APK_PATH"
            exit 1
          fi

      - name: Create ZIP artifact
        run: |
          zip -j NaydiVesch-Debug-APK.zip app/build/outputs/apk/debug/app-debug.apk
          echo "ZIP created: $(ls -lh NaydiVesch-Debug-APK.zip)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NaydiVesch-Debug-APK
          path: NaydiVesch-Debug-APK.zip
          retention-days: 30